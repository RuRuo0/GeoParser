data_root: 'dataset'
ckpt_name: 'vitL-129M'
checkpoint: 'checkpoint/BEST_checkpoint-vitL-129M.pth.tar'
# set pretrained as a file path or an url
pretrained: 'pretrained/model_large.pth'
level: 'leveldict/train-vitL-129M.json'
generate: "generate/train-vitL-129M.json"

# size of vit model; base or large
#vit: 'base'
#vit_grad_ckpt: False
#vit_ckpt_layer: 0
#batch_size: 4
#init_lr: 1e-5

vit: 'large'
vit_grad_ckpt: True
vit_ckpt_layer: 5
batch_size: 2
init_lr: 1e-5

image_size: 512

# generation configs
#max_length: 270
max_length: 450
min_length: 10
num_beams: 5

# optimizer
weight_decay: 0.05
min_lr: 5e-6
max_epoch: 30

